# ============================================================================
# GitHub Actions Workflow: Build and Publish Python Wheels
#
# Builds multi-platform wheels using cibuildwheel and uploads to PyPI.
#
# Triggers:
#   - Push to tags matching v*.*.*
#   - GitHub Release published
#   - Manual workflow dispatch
#
# Required Secrets:
#   - PYPI_API_TOKEN: PyPI API token for uploading
#
# Usage:
#   1. Create PyPI API token at https://pypi.org/manage/account/token/
#   2. Add as repository secret: Settings > Secrets > PYPI_API_TOKEN
#   3. Push a version tag: git tag v0.8.0 && git push origin v0.8.0
# ============================================================================

name: Build and Publish Python Wheels

on:
  push:
    tags:
      - 'v*.*.*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      upload_to_pypi:
        description: 'Upload to PyPI'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, macos-14]
        # macos-15 = Intel, macos-14 = Apple Silicon
        # windows-2022 disabled: Universal library std::bit_cast MSVC issue

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel==2.21.3

      - name: Build wheels
        working-directory: python
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          # Build for Python 3.9-3.12
          CIBW_BUILD: "cp39-* cp310-* cp311-* cp312-*"

          # Skip 32-bit, musllinux, and PyPy
          CIBW_SKIP: "*-win32 *-manylinux_i686 *-musllinux* pp*"

          # Use manylinux2014 for broader compatibility
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux2014
          CIBW_MANYLINUX_AARCH64_IMAGE: manylinux2014

          # macOS deployment target
          CIBW_ENVIRONMENT_MACOS: "MACOSX_DEPLOYMENT_TARGET=10.15"

          # Install build dependencies (Linux needs cmake from pip)
          CIBW_BEFORE_BUILD_LINUX: "pip install cmake ninja numpy pybind11"
          CIBW_BEFORE_BUILD_MACOS: "pip install numpy pybind11"

          # Test the built wheel
          CIBW_TEST_REQUIRES: "pytest numpy"
          CIBW_TEST_COMMAND: "pytest {project}/tests -v -x --ignore={project}/tests/test_torch_backend.py --ignore={project}/tests/test_xue_integration.py -k 'not slow'"

          # Skip testing on emulated architectures (too slow)
          CIBW_TEST_SKIP: "*-macosx_arm64 *-manylinux_aarch64"

          # Verbose output
          CIBW_BUILD_VERBOSITY: 1

      - name: Upload wheels as artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: python/wheelhouse/*.whl

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tools
        run: python -m pip install build

      - name: Build sdist
        working-directory: python
        run: python -m build --sdist

      - name: Upload sdist as artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: python/dist/*.tar.gz

  publish:
    name: Publish to PyPI
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-22.04
    # Only publish on tag push, release, or manual trigger with upload enabled
    if: >
      github.event_name == 'push' ||
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' && inputs.upload_to_pypi)

    environment:
      name: pypi
      url: https://pypi.org/project/stillwater-kpu/

    permissions:
      id-token: write  # Required for trusted publishing

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List distribution files
        run: ls -la dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
          verbose: true
