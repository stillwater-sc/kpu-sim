# This starter workflow is for a CMake project running on multiple platforms. There is a different starter workflow if you just want a single platform.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-single-platform.yml
name: CMake on multiple platforms

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    # sccache uses the GitHub Actions cache as its storage backend. The action
    # injects the required credentials when SCCACHE_GHA_ENABLED is set.
    env:
      SCCACHE_GHA_ENABLED: "true"

    strategy:
      # Set fail-fast to false to ensure that feedback is delivered for all matrix combinations. Consider changing this to true when your workflow is stable.
      fail-fast: false

      # Set up a matrix to run the following 3 configurations:
      # 1. <Windows, Release, latest MSVC compiler toolchain on the default runner image, default generator>
      # 2. <Linux, Release, latest GCC compiler toolchain on the default runner image, default generator>
      # 3. <Linux, Release, latest Clang compiler toolchain on the default runner image, default generator>
      #
      # To add more build types (Release, Debug, RelWithDebInfo, etc.) customize the build_type list.
      matrix:
        os: [ubuntu-latest, windows-latest]
        build_type: [Release]
        c_compiler: [gcc, clang, cl]
        include:
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
          - os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: clang++
        exclude:
          - os: windows-latest
            c_compiler: gcc
          - os: windows-latest
            c_compiler: clang
          - os: ubuntu-latest
            c_compiler: cl

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Fetch all history and tags for version detection

    - name: Install CMake 4.2
      uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: '4.2.x'

    - name: Verify CMake version
      run: cmake --version

    - name: Install Ninja
      uses: seanmiddleditch/gha-setup-ninja@master

    # On Windows we replace the default Visual Studio generator with Ninja so
    # that CMAKE_*_COMPILER_LAUNCHER (the sccache hook) is honoured — MSBuild
    # ignores compiler launchers. ilammy/msvc-dev-cmd puts cl.exe on PATH so
    # Ninja can find the MSVC toolchain.
    - name: Set up MSVC environment
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1

    - name: Set up sccache
      uses: mozilla-actions/sccache-action@v0.0.7

    # Probe the sccache backend before relying on it. If GitHub Actions Cache
    # is having an incident the sccache server refuses to start, so falling
    # back to a plain build is strictly better than failing the whole job.
    # Only when this probe succeeds do we set SCCACHE_LAUNCHER, which the
    # Configure step uses to conditionally wire CMAKE_*_COMPILER_LAUNCHER.
    - name: Probe sccache backend
      shell: bash
      run: |
        if sccache --start-server; then
          echo "SCCACHE_LAUNCHER=sccache" >> "$GITHUB_ENV"
        else
          echo "::warning::sccache backend unavailable; building without compile cache"
        fi

    - name: Set reusable strings
      # Turn repeated input strings (such as the build output directory) into step outputs. These step outputs can be used throughout the workflow file.
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    - name: Configure CMake
      # Goes through the `release-werror` preset: Ninja generator, Release
      # build, CMAKE_INTERPROCEDURAL_OPTIMIZATION=ON (LTO), and KPU_WERROR=ON
      # (-Werror on gcc/clang, /WX on MSVC). One source of truth shared with
      # local opt-in builds; prevents the silent fallback to the Make
      # generator that bites if anyone bypasses --preset.
      #
      # KPU_WERROR is wired up via add_compile_options() in CMakeLists.txt,
      # not via CMAKE_CXX_FLAGS - that distinction matters on MSVC, where
      # -DCMAKE_CXX_FLAGS=/WX would overwrite the CMake defaults and silently
      # drop /EHsc (chrono C4530 cascade).
      #
      # Per-matrix compiler choice and sccache launcher are overlaid as
      # cache-variable overrides on top of the preset.
      run: >
        cmake --preset release-werror
        ${{ env.SCCACHE_LAUNCHER && format('-DCMAKE_C_COMPILER_LAUNCHER={0} -DCMAKE_CXX_COMPILER_LAUNCHER={0}', env.SCCACHE_LAUNCHER) || '' }}
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}

    - name: Upload build system info
      uses: actions/upload-artifact@v4
      with:
        name: build_system_info-${{ matrix.os }}-${{ matrix.c_compiler }}-${{ matrix.build_type }}.log
        path: ${{ steps.strings.outputs.build-output-dir }}/build_system_info.log

    - name: Build
      # --parallel is redundant with Ninja (which parallelises by default) but
      # kept as a belt-and-suspenders for any future generator switch.
      run: cmake --build --preset release-werror --parallel

    - name: Show sccache stats
      # Hit rate / miss count for this run; useful for spotting cold/warm
      # transitions and cache-thrash regressions in PRs that touch many TUs.
      # Skipped when the backend probe failed and we built without sccache.
      if: env.SCCACHE_LAUNCHER
      run: sccache --show-stats

    - name: Test
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      # Execute tests defined by the CMake configuration. Note that --build-config is needed because the default Windows generator is a multi-config generator (Visual Studio generator).
      # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
      # Exclude performance and benchmark tests from CI to avoid timeouts
      run: ctest --build-config ${{ matrix.build_type }} --output-on-failure --timeout 300 -LE "performance|benchmark"

    - name: Upload test log
      #if: success()
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: CTest-LastTest-${{ matrix.os }}-${{ matrix.c_compiler }}-${{ matrix.build_type }}.log
        path: ${{ steps.strings.outputs.build-output-dir }}/Testing/Temporary/LastTest.log
