[build-system]
requires = ["setuptools>=61.0", "wheel", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kpu"
dynamic = ["version"]  # Version from git tags via setuptools-scm
description = "KPU (Knowledge Processing Unit) Simulator Python API"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    {name = "Stillwater Supercomputing, Inc.", email = "info@stillwater-sc.com"}
]
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Compilers",
]
keywords = ["kpu", "simulator", "neural-network", "accelerator", "compiler"]
dependencies = [
    "numpy>=1.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]
torch = [
    "torch>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/stillwater-sc/kpu-sim"
Documentation = "https://github.com/stillwater-sc/kpu-sim/docs"
Repository = "https://github.com/stillwater-sc/kpu-sim"

[tool.setuptools.packages.find]
where = ["."]
include = ["kpu*"]

[tool.setuptools_scm]
# Use git tags for versioning
# Tags should be in format: v0.3.0
root = ".."
version_scheme = "guess-next-dev"
local_scheme = "node-and-date"
fallback_version = "0.2.0"

# Write version to a file for runtime access
write_to = "kpu/_version.py"
write_to_template = '''# Auto-generated by setuptools-scm - DO NOT EDIT
__version__ = "{version}"
__version_tuple__ = {version_tuple}
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
