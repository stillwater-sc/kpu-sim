<!DOCTYPE html>
<!--
  GDDR7 Memory Subsystem - Block Diagram Animation

  Animated visualization for GDDR7 with PAM3 signaling:
  - 16 Banks (4 Bank Groups x 4 Banks)
  - PAM3 (3-level) signaling at ~32 Gbps
  - Shorter burst due to higher data rate

  SPDX-License-Identifier: MIT
  Copyright (c) 2024-2025 Stillwater Supercomputing, Inc.
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GDDR7 Memory Subsystem - Block Diagram</title>
    <style>
        :root {
            --bg: #0f172a;
            --panel: #1e293b;
            --border: #334155;
            --text: #e2e8f0;
            --text-dim: #94a3b8;
            --accent: #3b82f6;
            --read: #22c55e;
            --write: #a855f7;
            --activate: #f59e0b;
            --idle: #475569;
            --active: #10b981;
            --mc: #8b5cf6;
            --phy: #06b6d4;
            --device: #f97316;
            --pam3: #ec4899;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow: hidden;
        }

        .header {
            background: var(--panel);
            border-bottom: 1px solid var(--border);
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header h1 { font-size: 14px; font-weight: 600; }

        .controls { display: flex; align-items: center; gap: 10px; }

        button {
            background: var(--border);
            color: var(--text);
            border: none;
            padding: 6px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }

        button:hover { background: #475569; }
        button.active { background: var(--accent); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }

        .cycle-display {
            font-family: 'SF Mono', monospace;
            font-size: 13px;
            background: var(--panel);
            padding: 6px 12px;
            border-radius: 4px;
            border: 1px solid var(--border);
        }

        .main-container { display: flex; height: calc(100vh - 50px); }

        .diagram-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 10px 20px;
            overflow: hidden;
        }

        #diagram { width: 100%; flex: 1; min-height: 0; }

        .component { cursor: pointer; transition: filter 0.2s; }
        .component:hover { filter: brightness(1.2); }

        .component-box { fill: var(--panel); stroke: var(--border); stroke-width: 2; rx: 6; }
        .component-box.mc { stroke: var(--mc); }
        .component-box.phy { stroke: var(--phy); }
        .component-box.device { stroke: var(--device); }

        .sub-block { fill: #334155; stroke: #475569; stroke-width: 1; rx: 3; }

        .bank-box { fill: var(--idle); stroke: #64748b; stroke-width: 1; rx: 2; transition: fill 0.2s; }
        .bank-box.idle { fill: var(--idle); stroke: #64748b; }
        .bank-box.activating { fill: #b45309; stroke: var(--activate); }
        .bank-box.active { fill: #047857; stroke: var(--active); }
        .bank-box.reading { fill: #1d4ed8; stroke: var(--read); }
        .bank-box.writing { fill: #7c3aed; stroke: var(--write); }

        .bank-label { fill: white; font-size: 7px; font-weight: 600; text-anchor: middle; }

        .connection { fill: none; stroke: var(--border); stroke-width: 2; }

        .bus-segment { fill: none; stroke-width: 2; stroke-linecap: round; }
        .bus-segment.idle { stroke: var(--idle); }
        .bus-segment.ca-active { stroke: var(--activate); fill: rgba(245, 158, 11, 0.2); }
        .bus-segment.dq-read { stroke: var(--read); fill: rgba(34, 197, 94, 0.2); }
        .bus-segment.dq-write { stroke: var(--write); fill: rgba(168, 85, 247, 0.2); }

        .token { transition: transform 0.15s ease-out; }
        .token-body { stroke-width: 2; }
        .token-body.read { fill: var(--read); stroke: #16a34a; }
        .token-body.write { fill: var(--write); stroke: #9333ea; }
        .token-label { fill: white; font-size: 7px; font-weight: bold; text-anchor: middle; }

        @keyframes pulse { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }
        .bus-active { animation: pulse 0.3s ease-in-out infinite; }

        .block-title { fill: var(--text); font-size: 10px; font-weight: 600; text-anchor: middle; }
        .block-title.mc { fill: var(--mc); }
        .block-title.phy { fill: var(--phy); }
        .block-title.device { fill: var(--device); }

        .sidebar {
            width: 260px;
            background: var(--panel);
            border-left: 1px solid var(--border);
            padding: 15px;
            overflow-y: auto;
        }

        .sidebar h2 {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-dim);
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .info-section { margin-bottom: 20px; }

        .stat-row {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            font-size: 11px;
            border-bottom: 1px solid var(--border);
        }

        .stat-label { color: var(--text-dim); }
        .stat-value { font-family: 'SF Mono', monospace; }

        .legend { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
        .legend-item { display: flex; align-items: center; gap: 5px; font-size: 9px; }
        .legend-color { width: 12px; height: 12px; border-radius: 2px; }

        .no-data {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: var(--text-dim);
        }

        .pam3-indicator { fill: var(--pam3); font-size: 8px; font-weight: bold; }
    </style>
</head>

    <script>
        // GDDR7: 16 banks (4 bank groups x 4 banks)
        const NUM_BANKS = 16;
        const BANKS_PER_GROUP = 4;

        let traceData = null;
        let requests = [];
        let currentCycle = 0;
        let maxCycle = 0;
        let isPlaying = false;
        let playInterval = null;

        const POSITIONS = {
            mc_scheduler: { x: 140, y: 169 },
            mc_txproc: { x: 195, y: 115 },
            phy_ca: { x: 335, y: 97 },
            phy_data: { x: 335, y: 132 },
            ca_bus: { x: 420, y: 97 },
            dq_bus: { x: 420, y: 184 },
            bank: (b) => {
                const group = Math.floor(b / BANKS_PER_GROUP);
                const local = b % BANKS_PER_GROUP;
                return { x: 524 + local * 35, y: 89 + group * 42 };
            }
        };

        function parseTrace(data) {
            requests = [];
            const txnEvents = new Map();

            for (const item of data) {
                if (item.ph === 'M') continue;
                const txnId = item.args?.txn_id;
                if (txnId === undefined) continue;
                if (!txnEvents.has(txnId)) txnEvents.set(txnId, []);
                txnEvents.get(txnId).push({
                    name: item.name,
                    cycleStart: item.args?.cycle_issue || 0,
                    cycleEnd: item.args?.cycle_complete || 0,
                    bank: item.tid || 0
                });
            }

            let idx = 0;
            for (const [txnId, evts] of txnEvents) {
                evts.sort((a, b) => a.cycleStart - b.cycleStart);
                const first = evts[0];
                const last = evts[evts.length - 1];

                const isRead = evts.some(e => e.name.includes('READ'));
                const isWrite = evts.some(e => e.name.includes('WRITE'));
                if (!isRead && !isWrite) continue;

                const stages = [];
                const hasActivate = evts.some(e => e.name === 'ACTIVATE');
                const activateEvt = evts.find(e => e.name === 'ACTIVATE');
                const dataEvt = evts.find(e => e.name.includes('READ') || e.name.includes('WRITE'));

                const firstDramCycle = hasActivate ? activateEvt.cycleStart : dataEvt?.cycleStart || first.cycleStart;
                const schedulerStart = Math.max(0, firstDramCycle - 8);

                stages.push({ stage: 'mc_scheduler', start: schedulerStart, end: schedulerStart + 2 });
                stages.push({ stage: 'mc_txproc', start: schedulerStart + 2, end: schedulerStart + 4 });
                stages.push({ stage: 'phy_ca', start: schedulerStart + 4, end: firstDramCycle });

                if (hasActivate && activateEvt) {
                    stages.push({ stage: 'bank', start: activateEvt.cycleStart, end: activateEvt.cycleEnd, bank: activateEvt.bank, op: 'activate' });
                }

                if (dataEvt) {
                    stages.push({ stage: 'bank', start: dataEvt.cycleStart, end: dataEvt.cycleEnd, bank: dataEvt.bank, op: isRead ? 'read' : 'write' });
                    stages.push({ stage: 'dq_bus', start: dataEvt.cycleEnd, end: dataEvt.cycleEnd + 2, direction: isRead ? 'read' : 'write' });
                    stages.push({ stage: 'phy_data', start: dataEvt.cycleEnd + 2, end: dataEvt.cycleEnd + 4 });
                }

                stages.sort((a, b) => a.start - b.start);

                requests.push({
                    id: idx++,
                    txnId,
                    type: isRead ? 'READ' : 'WRITE',
                    bank: first.bank,
                    cycleStart: stages[0].start,
                    cycleEnd: stages[stages.length - 1].end,
                    latency: last.cycleEnd - first.cycleStart,
                    stages
                });

                maxCycle = Math.max(maxCycle, stages[stages.length - 1].end + 5);
            }
            requests.sort((a, b) => a.cycleStart - b.cycleStart);
            return requests;
        }

        function createToken(req) {
            const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
            g.setAttribute('class', 'token');
            g.setAttribute('id', `token-${req.id}`);
            g.style.display = 'none';

            const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
            circle.setAttribute('class', `token-body ${req.type.toLowerCase()}`);
            circle.setAttribute('r', '8');

            const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
            text.setAttribute('class', 'token-label');
            text.setAttribute('dy', '3');
            text.textContent = `R${req.id}`;

            g.appendChild(circle);
            g.appendChild(text);
            return g;
        }

        function initVisualization() {
            document.getElementById('tokens').innerHTML = '';
            for (const req of requests) {
                document.getElementById('tokens').appendChild(createToken(req));
            }
            updateVisualization();
        }

        function updateVisualization() {
            document.getElementById('currentCycle').textContent = currentCycle;

            for (let i = 0; i < NUM_BANKS; i++) {
                const bankBox = document.querySelector(`#bank-${i} .bank-box`);
                if (bankBox) bankBox.setAttribute('class', 'bank-box idle');
            }

            document.getElementById('ca-bus-segment').setAttribute('class', 'bus-segment idle');
            document.getElementById('dq-bus-segment').setAttribute('class', 'bus-segment idle');

            let inProgress = 0, completed = 0;
            let caActive = false, dqActive = false, dqDirection = 'read';

            for (const req of requests) {
                const token = document.getElementById(`token-${req.id}`);
                if (!token) continue;

                let currentStage = null;
                for (const stage of req.stages) {
                    if (currentCycle >= stage.start && currentCycle < stage.end) {
                        currentStage = stage;
                        break;
                    }
                }

                if (!currentStage) {
                    if (currentCycle >= req.cycleEnd) { completed++; token.style.display = 'none'; }
                    else if (currentCycle < req.cycleStart) { token.style.display = 'none'; }
                    continue;
                }

                inProgress++;
                token.style.display = 'block';

                let pos;
                if (currentStage.stage === 'bank') {
                    pos = POSITIONS.bank(currentStage.bank !== undefined ? currentStage.bank : req.bank);
                    const bankIdx = currentStage.bank !== undefined ? currentStage.bank : req.bank;
                    const bankBox = document.querySelector(`#bank-${bankIdx} .bank-box`);
                    if (bankBox) {
                        if (currentStage.op === 'read') bankBox.setAttribute('class', 'bank-box reading');
                        else if (currentStage.op === 'write') bankBox.setAttribute('class', 'bank-box writing');
                        else bankBox.setAttribute('class', 'bank-box activating');
                    }
                } else {
                    pos = POSITIONS[currentStage.stage] || { x: 100, y: 100 };
                }

                if (currentStage.stage === 'phy_ca') caActive = true;
                if (currentStage.stage === 'dq_bus') { dqActive = true; dqDirection = currentStage.direction || 'read'; }

                token.setAttribute('transform', `translate(${pos.x}, ${pos.y})`);
                document.getElementById('currentReq').textContent = `R${req.id} (${req.type})`;
                document.getElementById('currentBank').textContent = req.bank;
            }

            if (caActive) document.getElementById('ca-bus-segment').setAttribute('class', 'bus-segment ca-active bus-active');
            if (dqActive) document.getElementById('dq-bus-segment').setAttribute('class', `bus-segment dq-${dqDirection} bus-active`);

            document.getElementById('statTotal').textContent = requests.length;
            document.getElementById('statCompleted').textContent = completed;
            document.getElementById('statInProgress').textContent = inProgress;
            document.getElementById('statLatency').textContent = requests.length > 0 ? `${Math.round(requests.reduce((s, r) => s + r.latency, 0) / requests.length)} cy` : '0 cy';
        }

        document.getElementById('fileInput').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            try {
                traceData = JSON.parse(await file.text());
                requests = parseTrace(traceData);
                if (requests.length > 0) {
                    document.getElementById('noData').style.display = 'none';
                    document.getElementById('diagram').style.display = 'block';
                    document.getElementById('maxCycle').textContent = maxCycle;
                    currentCycle = 0;
                    initVisualization();
                    document.getElementById('btnReset').disabled = false;
                    document.getElementById('btnStep').disabled = false;
                    document.getElementById('btnPlay').disabled = false;
                }
            } catch (err) { alert('Error: ' + err.message); }
        });

        document.getElementById('btnReset').addEventListener('click', () => { currentCycle = 0; stopPlayback(); updateVisualization(); });
        document.getElementById('btnStep').addEventListener('click', () => { if (currentCycle < maxCycle) { currentCycle++; updateVisualization(); } });
        document.getElementById('btnPlay').addEventListener('click', () => { if (isPlaying) stopPlayback(); else startPlayback(); });

        function startPlayback() {
            isPlaying = true;
            document.getElementById('btnPlay').textContent = 'Pause';
            document.getElementById('btnPlay').classList.add('active');
            playInterval = setInterval(() => {
                if (currentCycle < maxCycle) { currentCycle++; updateVisualization(); }
                else stopPlayback();
            }, 550 - document.getElementById('speedSlider').value);
        }

        function stopPlayback() {
            isPlaying = false;
            document.getElementById('btnPlay').textContent = 'Play';
            document.getElementById('btnPlay').classList.remove('active');
            if (playInterval) { clearInterval(playInterval); playInterval = null; }
        }

        document.getElementById('speedSlider').addEventListener('input', () => { if (isPlaying) { stopPlayback(); startPlayback(); } });

        document.addEventListener('keydown', (e) => {
            if (requests.length === 0) return;
            if (e.key === ' ') { e.preventDefault(); document.getElementById('btnPlay').click(); }
            else if (e.key === 'ArrowRight') { e.preventDefault(); document.getElementById('btnStep').click(); }
            else if (e.key === 'ArrowLeft' && currentCycle > 0) { e.preventDefault(); currentCycle--; updateVisualization(); }
            else if (e.key === 'Home') { e.preventDefault(); document.getElementById('btnReset').click(); }
        });
    </script>
</body>
</html>
